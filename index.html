<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="可由 GitHub 更新的個人課程資源指南。" />
    <title>課程資源指南</title>
    <link rel="stylesheet" href="assets/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="#top">課程資源指南</a>
      <a class="edit-link" href="https://github.com/aichi0121/course-download-guide/edit/main/content/guide.html" target="_blank" rel="noreferrer">在 GitHub 編輯內容 ↗</a>
    </header>
    <main id="top">
      <section class="hero">
        <p>PERSONAL COURSE LIBRARY</p>
        <h1>課程內容，<br />有條理地整理。</h1>
        <span>這是獨立網站，不會回到 Project Hub。</span>
      </section>
      <section id="guide-content" class="guide-content" aria-live="polite">
        <p class="loading">正在載入指南…</p>
      </section>
    </main>
    <footer>課程資源指南 · 內容由 GitHub 版控</footer>
    <script>
      fetch("content/guide.html")
        .then((response) => {
          if (!response.ok) throw new Error("content unavailable");
          return response.text();
        })
        .then((html) => { document.getElementById("guide-content").innerHTML = html; })
        .catch(() => {
          document.getElementById("guide-content").innerHTML = '<p class="loading">內容暫時無法載入。請到 GitHub 查看原稿。</p>';
        });
    </script>
  </body>
</html>
