<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,nofollow" />
    <title>課程資源指南｜管理</title>
    <link rel="stylesheet" href="assets/admin.css" />
    <link rel="stylesheet" href="assets/admin-extra.css" />
  </head>
  <body>
    <main class="admin-shell">
      <header><div><p>課程資源指南</p><h1>編輯內容</h1></div><a href="./">查看公開頁</a></header>
      <section class="notice"><b>這裡只給管理者使用。</b><span>所有內容都用一般表單編輯；發布後約一分鐘會出現在公開頁。</span></section>
      <form id="editor">
        <section class="panel"><h2>頁面說明</h2><label>標題<input name="introTitle" required /></label><label>內文<textarea name="introText" rows="3" required></textarea></label></section>
        <div id="platforms"></div>
        <button class="add-platform" type="button" id="add-platform">＋ 新增平台</button>
        <section class="panel publish"><h2>發布到網站</h2><p>第一次發布時，請貼上只限此專案內容編輯權限的 GitHub fine-grained personal access token。它只會留在目前分頁。</p><label>GitHub 存取權杖<input id="token" type="password" autocomplete="off" placeholder="github_pat_…" /></label><button id="publish" type="submit">發布更新</button><p id="status" role="status"></p></section>
      </form>
    </main>
    <template id="platform-template">
      <section class="panel platform">
        <div class="panel-title"><h2>平台內容</h2><button type="button" class="remove">移除此平台</button></div>
        <div class="two"><label>平台名稱<input data-field="name" required /></label><label>小標籤<input data-field="label" required /></label></div>
        <label>說明文字<textarea data-field="description" rows="3" required></textarea></label>
        <div class="two"><label>連結網址<input data-field="url" type="url" required /></label><label>連結文字<input data-field="linkLabel" required /></label></div>
        <div class="links"><div class="steps-head"><h3>下載與其他連結</h3><button type="button" class="add-link">＋ 新增連結</button></div><div class="link-list"></div></div>
        <div class="steps"><div class="steps-head"><h3>步驟</h3><button type="button" class="add-step">＋ 新增步驟</button></div><div class="step-list"></div></div>
      </section>
    </template>
    <template id="step-template"><div class="step"><textarea rows="2" placeholder="輸入一個步驟"></textarea><button type="button" aria-label="移除步驟">×</button></div></template>
    <template id="link-template"><div class="link-row"><input placeholder="按鈕文字，例如：下載 ZIP" /><input type="url" placeholder="https://…" /><button type="button" aria-label="移除連結">×</button></div></template>
    <script src="assets/admin.js"></script>
  </body>
</html>
